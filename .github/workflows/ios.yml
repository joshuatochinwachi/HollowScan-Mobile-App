name: Build iOS
on:
  workflow_dispatch: # Manual Trigger Only (to save GitHub minutes)

jobs:
  build:
    runs-on: macos-15 # Required for React Native 0.81+ (Xcode 16+)
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm install --legacy-peer-deps
        
      - name: Setup Native iOS Project
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: npx expo prebuild --platform ios

      - name: Install EAS CLI
        run: npm install -g eas-cli

      - name: Inject Secrets
        run: |
          cat << 'EOF' > eas.json
          ${{ secrets.EAS_JSON }}
          EOF
          echo "${{ secrets.IOS_CERTIFICATE_BASE64 }}" | base64 --decode > release.p12
          echo "${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}" | base64 --decode > release.mobileprovision
          
          # Generate the official credentials.json for local signing
          cat <<EOF > credentials.json
          {
            "ios": {
              "production": {
                "provisioningProfilePath": "./release.mobileprovision",
                "distributionCertificate": {
                  "path": "./release.p12",
                  "password": "${{ secrets.IOS_CERTIFICATE_PASS }}"
                }
              }
            }
          }
          EOF

      - name: Build iOS IPA (Local on GitHub)
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          GOOGLE_SERVICES_IOS: ${{ secrets.GOOGLE_SERVICES_IOS }}
          EAS_NO_VCS: 1
        run: |
          npx eas-cli build --platform ios --profile production --local --non-interactive

      - name: Upload iOS Archive
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build
          path: ./**/*.ipa
