name: Build iOS
on:
  workflow_dispatch: # Manual Trigger Only (to save GitHub minutes)

jobs:
  build:
    runs-on: macos-latest # Required for iOS compilation
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install EAS CLI
        run: npm install -g eas-cli

      - name: Inject Secrets
        run: |
          cat << 'EOF' > GoogleService-Info.plist
          ${{ secrets.GOOGLE_SERVICES_IOS }}
          EOF
          cat << 'EOF' > eas.json
          ${{ secrets.EAS_JSON }}
          EOF
          echo "${{ secrets.IOS_CERTIFICATE_BASE64 }}" | base64 --decode > release.p12
          echo "${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}" | base64 --decode > release.mobileprovision

      - name: Build iOS IPA (Local on GitHub)
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          # The --local flag tells EAS to build on THIS machine (GitHub), not the Expo cloud
          npx eas-cli build --platform ios --profile production --local --non-interactive \
            --certificate-path ./release.p12 \
            --certificate-password "${{ secrets.IOS_CERTIFICATE_PASS }}" \
            --provisioning-profile-path ./release.mobileprovision

      - name: Upload iOS Archive
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build
          path: ./**/*.ipa
