name: Build iOS
on:
  workflow_dispatch: # Manual Trigger Only (to save GitHub minutes)

jobs:
  build:
    runs-on: macos-latest # Required for iOS compilation
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install EAS CLI
        run: npm install -g eas-cli

      - name: Inject Secrets
        run: |
          cat << 'EOF' > GoogleService-Info.plist
          ${{ secrets.GOOGLE_SERVICES_IOS }}
          EOF
          cat << 'EOF' > eas.json
          ${{ secrets.EAS_JSON }}
          EOF

      - name: Build iOS IPA (Local on GitHub)
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          # These secrets allow GitHub to sign your app without EAS cloud
          IOS_CERTIFICATE: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          IOS_CERT_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASS }}
          IOS_PROVISIONING_PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          # The --local flag tells EAS to build on THIS machine (GitHub), not the Expo cloud
          eas build --platform ios --profile production --local --non-interactive > build_log_ios.txt 2>&1 || { cat build_log_ios.txt; exit 1; }

      - name: Upload iOS Archive
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build
          path: ./**/*.ipa
