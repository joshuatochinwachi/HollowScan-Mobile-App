name: Build iOS
on:
  workflow_dispatch: # Manual Trigger Only (to save GitHub minutes)

jobs:
  build:
    runs-on: macos-latest # Required for iOS compilation
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install EAS CLI
        run: npm install -g eas-cli
      
      - name: Install JQ (for versioning)
        run: brew install jq

      - name: Inject Secrets
        run: |
          echo "${{ secrets.IOS_CERTIFICATE_BASE64 }}" | base64 --decode > release.p12
          echo "${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}" | base64 --decode > release.mobileprovision
          
          # Generate the official credentials.json for local signing
          cat <<EOF > credentials.json
          {
            "ios": {
              "production": {
                "provisioningProfilePath": "./release.mobileprovision",
                "distributionCertificate": {
                  "path": "./release.p12",
                  "password": "${{ secrets.IOS_CERTIFICATE_PASS }}"
                }
              }
            }
          }
          EOF

      - name: Bump Build Number
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          # Fetch current remote number, add 1, and set it back
          CURRENT_V=$(npx eas-cli build:version:get --platform ios --profile production --json | jq -r '.[0].buildNumber // 41')
          NEXT_V=$((CURRENT_V + 1))
          npx eas-cli build:version:set --platform ios --profile production --build-number $NEXT_V

      - name: Build iOS IPA (Local on GitHub)
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          GOOGLE_SERVICES_IOS: ${{ secrets.GOOGLE_SERVICES_IOS }}
          EAS_NO_VCS: 1
        run: |
          npx eas-cli build --platform ios --profile production --local --non-interactive

      - name: Upload iOS Archive
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build
          path: ./**/*.ipa
