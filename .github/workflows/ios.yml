name: Build iOS
on:
  workflow_dispatch: # Manual Trigger Only (to save GitHub minutes)

jobs:
  build:
    runs-on: macos-latest # Updated: Xcode 26 required for App Store submissions from May 2026
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm install --legacy-peer-deps
        

      - name: Install EAS CLI
        run: npm install -g eas-cli

      - name: Inject Secrets
        run: |
          cat << 'EOF' > eas.json
          ${{ secrets.EAS_JSON }}
          EOF
          echo "${{ secrets.IOS_CERTIFICATE_BASE64 }}" | base64 --decode > release.p12
          echo "${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}" | base64 --decode > release.mobileprovision
          
          # Generate the official credentials.json for local signing
          cat <<EOF > credentials.json
          {
            "ios": {
              "production": {
                "provisioningProfilePath": "./release.mobileprovision",
                "distributionCertificate": {
                  "path": "./release.p12",
                  "password": "${{ secrets.IOS_CERTIFICATE_PASS }}"
                }
              }
            }
          }
          EOF

      - name: Select Xcode 26 (Required for App Store from May 2026)
        run: |
          # Find the latest Xcode 26 installed on this runner
          XCODE_PATH=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XCODE_PATH" ]; then
            echo "❌ Xcode 26 not found! Available Xcode versions:"
            ls /Applications/ | grep Xcode
            exit 1
          fi
          sudo xcode-select -s "$XCODE_PATH/Contents/Developer"
          echo "✅ Selected: $(xcodebuild -version)"

      - name: Build iOS IPA (Local on GitHub)
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          GOOGLE_SERVICES_IOS: ${{ secrets.GOOGLE_SERVICES_IOS }}
          EAS_NO_VCS: 1
        run: |
          npx eas-cli build --platform ios --profile production --local --non-interactive

      - name: Upload iOS Archive
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build
          path: ./**/*.ipa
