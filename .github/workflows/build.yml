name: Build Android
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Install EAS CLI
        run: npm install -g eas-cli

      - name: Inject Secrets
        run: |
          cat << 'EOF' > google-services.json
          ${{ secrets.GOOGLE_SERVICES_ANDROID }}
          EOF
          cat << 'EOF' > eas.json
          ${{ secrets.EAS_JSON }}
          EOF

      - name: Build Android AAB
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EAS_NO_VCS: 1
        run: |
          npx eas-cli build --platform android --profile production --local --non-interactive --auto-credentials > build_log.txt 2>&1 || { cat build_log.txt; exit 1; }

      - name: Upload Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: android-build
          path: ./**/*.aab
